<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · MegaBrain Live Home</title>
  <style>
    :root { --canvas: #0b0c0e; --surface: #111317; --border: #343840; --field-border: #6b7079; --text: #f3f4f6; --secondary: #b7bbc3; --accent: #aaa2ff; --danger: #f06a6a; }
    * { box-sizing: border-box; }
    html { background: var(--canvas); color: var(--text); font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 32px 24px; }
    main { margin: 12vh auto 0; max-width: 440px; }
    h1 { font-size: 24px; line-height: 1.3; margin: 0 0 16px; }
    p { color: var(--secondary); margin: 0 0 24px; }
    label { display: block; margin-bottom: 8px; }
    input, button { border: 1px solid var(--border); border-radius: 4px; font: inherit; min-height: 48px; padding: 8px 16px; width: 100%; }
    input { background: var(--surface); border-color: var(--field-border); caret-color: var(--accent); color: var(--text); }
    button { background: var(--surface); color: var(--accent); cursor: pointer; margin: 16px 0 24px; }
    button:hover { border-color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    ::selection { background: var(--accent); color: var(--canvas); }
    #login-status { color: var(--danger); }
    .note { border-top: 1px solid var(--border); font-size: 14px; padding-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>MegaBrain Live Home</h1>
    <p>Sign in to browse your Brain. This page can read knowledge, never change it.</p>
    <p id="login-status" role="status"></p>
    <form method="post" action="/login">
      <label for="password">Owner passphrase</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
      <button type="submit">Sign in</button>
    </form>
    <p class="note">This sign-in is separate from your agents. First release: general knowledge only. Private and sensitive records stay outside this viewer. For corrections or forgetting, ask a connected agent.</p>
  </main>
</body>
</html>
