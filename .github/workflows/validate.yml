name: Validate MegaBrain

on:
  # Feature-branch pushes are covered by pull_request, so they do not
  # start a second identical run. Merge commits on main and version
  # branches still validate once.
  push:
    branches:
      - main
      - "v[0-9]*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - run: MEGABRAIN_ROOT=skill/megabrain/seed python3 skill/megabrain/scripts/megabrain.py validate
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tests/browser_smoke.py
        env:
          CHROME: /usr/bin/google-chrome
      - run: python3 tests/live_browser_smoke.py
        env:
          CHROME: /usr/bin/google-chrome
